<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROGUE | Code. Design. Impact.</title>
    <meta name="description" content="Code. Design. Impact. Web development crafted for modern businesses." />

    <!-- Favicon & App Icons (1:1 Black square with 3D white rocket) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256x256.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Open Graph / WhatsApp / Social Sharing Meta Tags (1:1 Black square with 3D white rocket) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rogue-developer.vercel.app/" />
    <meta property="og:title" content="ROGUE | Code. Design. Impact." />
    <meta property="og:description" content="Code. Design. Impact. Web development crafted for modern businesses." />
    <meta property="og:image" content="https://rogue-developer.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://rogue-developer.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="310" />
    <meta property="og:image:height" content="310" />
    <meta property="og:image:alt" content="ROGUE 3D White Rocket Logo" />
    <meta property="og:site_name" content="ROGUE" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://rogue-developer.vercel.app/" />
    <meta name="twitter:title" content="ROGUE | Code. Design. Impact." />
    <meta name="twitter:description" content="Code. Design. Impact. Web development crafted for modern businesses." />
    <meta name="twitter:image" content="https://rogue-developer.vercel.app/og-image.png" />

    <!-- Security Meta Tags & Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), browsing-topics=()" />

    <!-- Performance: Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />

    <!-- Preload Critical Universe, Reveal & Storytelling Assets -->
    <link rel="preload" as="image" href="/img/universe.jpg" />
    <link rel="preload" as="image" href="/img/creatures in planets wallpaper.png" />
    <link rel="preload" as="image" href="/img/creatures-in-planets-wallpaper-2.png" />
  </head>
  <body>
    <!-- Navigation Header with Language Selector -->
    <header class="site-header" id="siteHeader"></header>

    <main id="mainContent">
      <!-- Section 1: Hero Section with 3D Falling Typography, Universe, 3D Stars, and Spotlight Reveal -->
      <section class="hero-section" id="heroSection"></section>

      <!-- Section 2: Cinematic Scroll-Driven Storytelling & Services Exhibition -->
      <section class="story-section" id="storytellingSection"></section>

      <!-- Section 3: Portfolio Universe — Interactive Digital Archive of Unexplored Worlds -->
      <section class="portfolio-universe-section" id="portfolioUniverseSection"></section>

      <!-- Section 4: Who I Am — Space Console Pilot Profile & Skills -->
      <section class="who-i-am-section" id="whoIAmSection"></section>

      <!-- Section 5: Contact — Subspace Communications Terminal -->
      <section class="contact-section" id="contactSection"></section>

      <!-- Section 6: Large Visually Striking Universe Footer -->
      <footer class="universe-footer" id="universeFooter"></footer>
    </main>

    <!-- Application Bundle -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
